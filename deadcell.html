const tr=()=>T[lang];
function font(px,w){w=w||700;
 if(lang==='en')return w+' '+px+'px Futura,"Futura PT","Century Gothic",Jost,"Trebuchet MS",sans-serif';
 if(lang==='ja')return w+' '+px+'px Rajdhani,"M PLUS 1 Code","Noto Sans JP",sans-serif';
 return w+' '+px+'px "Noto Sans SC","PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif';}
function TX(){return S.crisp?uctx:ctx;}
function setLSOn(c,v){try{c.letterSpacing=v;}catch(e){}}
function text(s,x,y,size,weight,align,color,ls){
 const c=TX();c.font=font(size,weight);c.textAlign=align||'left';
 if(ls&&lang!=='zh')setLSOn(c,ls);c.fillStyle=color;c.fillText(s,x,y);
 if(ls&&lang!=='zh')setLSOn(c,'0px');}
function measure(s,size,weight){const c=TX();c.font=font(size,weight);return c.measureText(s).width;}

/* ================= 像素艺术标题 ================= */
let titlePix=null,titlePixKey='';
function makePixelTitle(){
 if(titlePixKey===lang&&titlePix)return;
 const txt=tr().title;
 const fs=lang==='en'?42:36;
 const k=3;
 const c=document.createElement('canvas'),g=c.getContext('2d');
 g.font=font(fs,900);
 const tw=Math.ceil(g.measureText(txt).width);
 c.width=tw+8;c.height=Math.ceil(fs*1.35);
 g.font=font(fs,900);g.textBaseline='middle';g.fillStyle='#fff';
 g.fillText(txt,4,c.height/2);
 const d=g.getImageData(0,0,c.width,c.height).data;
 const gw=Math.ceil(c.width/k),gh=Math.ceil(c.height/k);
 const raw=[];
 let minX=1e9,minY=1e9,maxX=-1,maxY=-1;
 for(let gy=0;gy<gh;gy++)for(let gx=0;gx<gw;gx++){
  let on=0,tot=0;
  for(let yy=0;yy<k;yy++)for(let xx=0;xx<k;xx++){

 plats=[];spikes=[];pits=[];lamps=[];signs=[];vigs=[];safeSegs=[];npcs=[];cps=[];chests=[];

  let g=0;if(total+len<target-150)g=40+R()*35;
  gaps.push(g);total+=len+g;}
 const ns=lens.length;
 const safeSet=new Set([clamp(Math.round(ns*.22),1,ns-2),clamp(Math.round(ns*.68),1,ns-2)]);
 for(const si of safeSet){if(si-1>=0)gaps[si-1]=0;gaps[si]=0;}

 plats.push({x:-24,y:-100,w:24,h:420,neon:'#000'},{x:levelW,y:-100,w:24,h:420,neon:'#000'});

 segs.forEach((s,i)=>{
  lamps.push({x:s.x+12+R()*Math.max(s.w-24,10),y:222,c:s.safe?'#ffb347':(R()<.3?'#ff3fae':'#25e8ff')});
  if(s.safe){

   npcs.push({x:s.x+s.w*.3,type:t1,talkLine:-1,chars:0,face:1,lines:DL[t1]});

  }else{
   if(R()<.66)vigs.push({x:s.x+24+R()*Math.max(s.w-48,10),type:VIGTYPES[(R()*VIGTYPES.length)|0]});
   if(R()<.4)signs.push({x:s.x+30+R()*Math.max(s.w-60,10),y:150+R()*30,
    t:SIGNS[(R()*SIGNS.length)|0],c:NEON[(R()*NEON.length)|0],ph:R()*9});}
 });
 fest.src=vigs.find(v=>v.type==='festival')||null;
 const cand=segs.filter(s=>!s.safe&&s.w>60);
 const nChest=(R()<.6?1:0)+(n%3===0?1:0);
 for(let i=0;i<nChest;i++){
  const s=cand[(R()*cand.length)|0];
  if(s)chests.push({x:s.x+30+R()*Math.max(s.w-60,10),y:212,w:14,h:10,opened:false});}

  if(e.onGround&&want!==0&&!(e.type==='boss'&&e.dashT>0)&&e.type!=='brute'&&!groundAhead(e,want>0?1:-1)){

 }

   continue;}
  if(b.fw){b.vy+=.06;b.x+=b.vx;b.y+=b.vy;b.fuse--;
   let ex=b.fuse<=0;
   for(const p of plats)if(b.x>p.x&&b.x<p.x+p.w&&b.y>p.y&&b.y<p.y+p.h)ex=true;

   if(ex){const d2=Math.hypot(P.x-b.x,P.y-b.y);

   continue;}

function killEnemy(e,i){

  snd(600,60,.6,'sawtooth',.16);}

}

 if(state==='play'&&!paused){
  const wTS=S.ts*(bulletT>0?S.btf:1),pTS=S.ts;
  pAcc+=pTS;wAcc+=wTS;let g=0;
  while(pAcc>=1&&g<3){pAcc--;updatePlayer();g++;}
  g=0;while(wAcc>=1&&g<3){wAcc--;updateEnemies();updateDrops();updateParts();g++;}
  if(fest.src&&!fest.done&&wave>=2){
   fest.delay--;
   if(fest.delay<=0&&!fest.active){
    fest.active=true;fest.left=2400;fest.spawnT=60;
    banner=tr().fest;bannerT=150;glitchT=Math.max(glitchT,6);snd(400,800,.5,'sine',.12);}
   if(fest.active){
    fest.left--;fest.spawnT--;
    if(fest.spawnT<=0&&enemies.filter(e=>e.type==='lantern').length<4){
     fest.spawnT=150;
     spawnEnemy(fest.src.x+rnd(-30,30),120,'lantern',wave);
     enemies[enemies.length-1].baseY=120+rnd(-10,20);
     snd(700,500,.15,'triangle',.06);}
    if(fest.left<=0){
     fest.active=false;fest.done=true;
     banner=tr().festEnd;bannerT=150;snd(600,1000,.4,'sine',.12);
     for(let k=0;k<14;k++)drops.push({x:fest.src.x+rnd(-14,14),y:180,
      vx:rnd(-1.5,1.5),vy:rnd(-3,-1),t:'cell'});
     drops.push({x:fest.src.x,y:180,vx:0,vy:-2.5,t:'potion'});}}}
  if(enemies.length===0&&!fest.active){transT++;
   if(transT===60){banner=tr().cleared;bannerT=110;snd(500,900,.3,'sine',.08);}
   if(transT>160){
    /* 速通目标结算 */
    if(SRUN.active&&SRUN.goal===wave){
     const ms=performance.now()-SRUN.start;
     resultData=buildResult(wave,ms,false);resultOpen=true;
     const gi=SR_GOALS.indexOf(wave);
     SRUN.goal=(gi>=0&&gi<SR_GOALS.length-1)?SR_GOALS[gi+1]:0;
     snd(700,1200,.4,'sine',.12);}
    transT=0;wave++;
    P.hp=Math.min(P.maxHp,P.hp+30);P.dmg+=3;
    P.x=40;P.y=150;P.vx=0;P.vy=0;P.inv=60;makeLevel(wave);}
  }else if(enemies.length>0)transT=0;
 }
 const tx=clamp(P.x+P.w/2-W/2,-10,Math.max(0,levelW-W+10));
 const ty=clamp(P.y-H/2+40,-40,60);
 camX+=(tx-camX)*.1;camY+=(ty-camY)*.06;
 if(shake>0){camX+=rnd(-shake,shake);camY+=rnd(-shake,shake);
  shake*=.85;if(shake<.3)shake=0;}
 drawSky();drawLayers();drawWorld();drawEnemies();
 for(const n of npcs)drawNPC(n);
 drawPlayer();drawParts();drawRain();drawFog();
 if(bulletT>0)drawBT();
 drawHUD();
 if(state==='dead'&&!resultOpen)drawDead();
 if(resultOpen)drawResult();
 if(shopOpen)drawShop();
 if(codexOpen)drawCodex();
 if(settingsOpen)drawSettings();
 glitchPost();
}
initWeather();regenSky();loop();
</script>
